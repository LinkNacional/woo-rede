name: Generate new release for plugin

on:
  workflow_dispatch:
  pull_request:
    types: [ closed ]
    branches: [ main ]

env:
  PLUGIN_NAME: woo-rede
  DIR_NAME: woo-rede
  PHP_VERSION: "7.4"
  DEPLOY_TAG: "5.4.11"

jobs:
  release-build:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3

    - name: Run composer install
      uses: php-actions/composer@v6
      with:
        php_version: ${{ env.PHP_VERSION }}
        working_dir: "."
        args: --ignore-platform-reqs
        command: install
        dev: no

    # Gera o body da release (metadados + resumo do changelog) — mesmo conteúdo do PR
    - name: Generate release body
      run: |
        mkdir -p dist
        bash .github/scripts/generate-release-body.sh > dist/release-body.md

  #  - name: Executar Plugin Check com configurações personalizadas
  #    uses: wordpress/plugin-check-action@v1
  #    with:
  #      build-dir: './'
  #      exclude-directories: 'node_modules,vendor,.eslintrc'
  #      ignore-codes: |
  #        WordPress.WP.I18n.TextDomainMismatch
  #        WordPress.Security.NonceVerification.Missing
  #        WordPress.Security.NonceVerification.Recommended
  #        WordPress.DB.SlowDBQuery.slow_db_query_meta_key
  #        WordPress.DB.SlowDBQuery.slow_db_query_meta_value
  #        WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedVariableFound
  #        trademarked_term
  #        textdomain_mismatch
  #        hidden_files
  #      categories: |
  #        performance
  #        accessibility
  #        general
  #        plugin_repo
  #        security
  #      strict: true

    # Add plugin files to a root directory
    - name: Prepare plugin folder
      run: |
        mkdir -p dist
        mkdir -p build/${{ env.PLUGIN_NAME }}
        mv ./Admin ./Includes ./languages ./Public *.php *.txt ./build/${{ env.PLUGIN_NAME }}
        cp -r vendor ./build/${{ env.PLUGIN_NAME }}/vendor
        find ./build -type f -exec chmod 0644 {} +
        find ./build -type d -exec chmod 0755 {} +

    # Compact plugin as .zip
    - name: Archive Release
      uses: thedoctor0/zip-release@master
      with:
        type: 'zip'
        path: '.'
        directory: 'build'
        filename: '${{ env.PLUGIN_NAME }}.zip'
        exclusions: '*.git* /*node_modules/* .editorconfig'

    - name: Move .zip to custom location
      run: |
        mv ./build/${{ env.PLUGIN_NAME }}.zip ./dist/

    # Update version tag
    - name: Bump version and push tag
      id: tag_version
      uses: mathieudutour/github-tag-action@v6.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        custom_tag: ${{ env.DEPLOY_TAG }}

    # Generate new release
    - name: Generate new Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "dist/${{ env.PLUGIN_NAME }}.zip"
        bodyFile: "dist/release-body.md"
        token: ${{ secrets.GITHUB_TOKEN }}
        commit: "main"
        draft: true
        tag: ${{ steps.tag_version.outputs.new_tag }}
        name: Release ${{ steps.tag_version.outputs.new_tag }}
        